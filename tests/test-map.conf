# Changed path (ERE) => focused test commands for scripts/test-select.sh (F10). A path not listed here runs the full suite.
# Shared modules map to ALL on purpose: env.sh, sdd.sh, state.sh, workflow.sh, lib.sh, hooks.json are used by almost every suite.
@all => bash tests/roletier.test.sh ;; bash tests/smoke.test.sh ;; bash tests/pricing.test.sh ;; bash tests/budget.test.sh ;; bash tests/context-economy.test.sh ;; bash tests/contract.test.sh ;; bash tests/adapter.test.sh ;; bash tests/context.test.sh ;; bash tests/costroute.test.sh ;; bash tests/costbase.test.sh ;; bash tests/efficiency.test.sh ;; bash tests/evidence.test.sh ;; bash tests/hardening.test.sh ;; bash tests/memory.test.sh ;; bash tests/risk-floor.test.sh ;; bash tests/route.test.sh ;; bash tests/sdd.test.sh ;; bash tests/sdkit-dir.test.sh ;; bash tests/shared.test.sh ;; bash tests/tbench.test.sh ;; bash tests/telemetry.test.sh ;; bash tests/usage.test.sh ;; bash tests/workflow.test.sh ;; bash tests/litellm.test.sh ;; bash tests/ci.test.sh ;; bash tests/dispatch.test.sh ;; bash tests/knowledge.test.sh ;; bash tests/recover.test.sh ;; bash tests/security.test.sh ;; bash tests/trace.test.sh ;; bash tests/selection.test.sh ;; bash tests/reservation.test.sh ;; bash tests/install.test.sh
# `@always` = the gates no selection may skip: a focused run is NOT the full regression, but the budget / hardening / hard-cost gates always run with it.
@always => bash tests/hardening.test.sh ;; bash tests/budget.test.sh ;; bash tests/costroute.test.sh
# \1 in a command is the first group of the path regex
^scripts/(env|sdd|state|workflow|resolve-base|guard)\.sh$ => ALL
^scripts/(parse-verdict|dod-check)\.sh$ => bash tests/smoke.test.sh ;; bash tests/efficiency.test.sh ;; bash tests/evidence.test.sh ;; bash tests/hardening.test.sh ;; bash tests/sdd.test.sh ;; bash tests/adapter.test.sh ;; bash tests/workflow.test.sh
^hooks/(lib|hooks)\.(sh|json)$ => ALL
^bin/ => ALL
^(scripts|hooks)/parse-verdict\.sh$|^scripts/dod-check\.sh$|^hooks/record-verdict\.sh$ => bash tests/smoke.test.sh ;; bash tests/efficiency.test.sh ;; bash tests/evidence.test.sh ;; bash tests/hardening.test.sh ;; bash tests/sdd.test.sh
^hooks/(guard-budget|session-context)\.sh$|^templates/sdkit\.env$|^core/roles/ => bash tests/roletier.test.sh
^scripts/pricing\.sh$|^templates/pricing\.json$ => bash tests/pricing.test.sh
^scripts/usage\.sh$|^hooks/usage-log\.sh$ => bash tests/usage.test.sh ;; bash tests/report.test.sh ;; bash tests/telemetry.test.sh ;; bash tests/budget.test.sh ;; bash tests/route.test.sh ;; bash tests/reservation.test.sh
^scripts/telemetry\.sh$ => bash tests/telemetry.test.sh ;; bash tests/trace.test.sh ;; bash tests/tbench.test.sh ;; bash tests/contract.test.sh ;; bash tests/route.test.sh
^scripts/route\.sh$ => bash tests/route.test.sh ;; bash tests/costroute.test.sh ;; bash tests/reservation.test.sh ;; bash tests/recover.test.sh ;; bash tests/usage.test.sh
^scripts/run-role\.sh$ => bash tests/adapter.test.sh ;; bash tests/context.test.sh ;; bash tests/efficiency.test.sh ;; bash tests/telemetry.test.sh ;; bash tests/route.test.sh ;; bash tests/contract.test.sh ;; bash tests/evidence.test.sh ;; bash tests/usage.test.sh ;; bash tests/reservation.test.sh ;; bash tests/litellm.test.sh ;; bash tests/install.test.sh
^scripts/contract\.sh$|^hooks/check-contract\.sh$ => bash tests/contract.test.sh ;; bash tests/telemetry.test.sh ;; bash tests/workflow.test.sh ;; bash tests/recover.test.sh
^scripts/digest\.sh$|^tests/context\.test\.sh$ => bash tests/context.test.sh ;; bash tests/efficiency.test.sh
^bench/costbase\.sh$|^tests/costbase\.test\.sh$ => bash tests/costbase.test.sh
^scripts/adapter\.sh$|^tests/adapter\.test\.sh$ => bash tests/adapter.test.sh
^adapters\.d/|^tests/litellm\.test\.sh$ => bash tests/litellm.test.sh ;; bash tests/adapter.test.sh
^scripts/dispatch\.sh$|^tests/dispatch\.test\.sh$ => bash tests/dispatch.test.sh ;; bash tests/recover.test.sh
^scripts/knowledge\.sh$|^tests/knowledge\.test\.sh$ => bash tests/knowledge.test.sh
^scripts/recover\.sh$|^tests/recover\.test\.sh$ => bash tests/recover.test.sh ;; bash tests/reservation.test.sh
^scripts/(redact|audit)\.sh$|^tests/security\.test\.sh$ => bash tests/security.test.sh ;; bash tests/litellm.test.sh ;; bash tests/context.test.sh ;; bash tests/adapter.test.sh
^scripts/pr-check\.sh$|^bench/history\.sh$|^tests/ci\.test\.sh$ => bash tests/ci.test.sh
^tests/trace\.test\.sh$ => bash tests/trace.test.sh
^scripts/memory\.sh$ => bash tests/memory.test.sh
^scripts/test-select\.sh$|^tests/test-map\.conf$|^tests/selection\.test\.sh$ => bash tests/selection.test.sh ;; bash tests/report.test.sh
^tests/([a-z-]+)\.test\.sh$ => bash tests/\1.test.sh
^core/roles/|^agents/|^adapters/ => bash tests/smoke.test.sh ;; bash bin/build-adapters.sh --check
^skills/ => bash tests/smoke.test.sh ;; bash tests/workflow.test.sh
^(docs/.*|templates/ci/.*|bench/baselines/.*|bench/history\.jsonl|README\.md|CONTRIBUTING\.md|Implementation Roadmap\.md)$|(^|/)\.DS_Store$ => NONE
^scripts/report\.sh$|^hooks/value-report\.sh$|^tests/report\.test\.sh$ => bash tests/report.test.sh
^scripts/capped\.sh$|^hooks/guard-noisy\.sh$|^tests/context-economy\.test\.sh$ => bash tests/context-economy.test.sh
